<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIbo</title>
<meta name="description" content="AIbo — read the comics, explore the universe.">

<meta property="og:title" content="AIbo">
<meta property="og:description" content="Read the comics, explore the universe.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aibouniverse.com">
<meta property="og:image" content="https://aibouniverse.com/aibonewbkg.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" href="fonts/Doto-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  /* Doto is a variable font — one face, full weight range. */
  @font-face {
    font-family: 'Doto';
    src: url('fonts/Doto-Regular.woff2') format('woff2-variations'),
         url('fonts/Doto-Regular.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --teal: #00ffd0;
    --teal-dark: #00ccaa;
    --teal-soft: rgba(0, 255, 208, 0.15);
    --teal-soft-hi: rgba(0, 255, 208, 0.25);
    --danger: #f72585;
    --dark-bg: #0a0a0f;
    --dark-card: #15151f;
    --dark-border: #252536;
    --text-light: #e0e0e0;
    --text-muted: #8888aa;
    --radius-card: 15px;
    --radius-pill: 30px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Doto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: var(--text-light);
    background-color: var(--dark-bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  button, input { font: inherit; color: inherit; }

  :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- Background ---------- */
  .image-background { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .image-background img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.4);
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Shared controls ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--teal-soft);
    color: var(--teal);
    border: 1px solid var(--teal-dark);
    border-radius: var(--radius-pill);
    padding: 12px 25px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.25s ease;
  }
  .btn:hover:not(:disabled) { background: var(--teal-soft-hi); }
  .btn:disabled {
    background: rgba(136, 136, 170, 0.15);
    color: var(--text-muted);
    border-color: var(--text-muted);
    cursor: not-allowed;
  }
  .btn--sm { padding: 8px 16px; font-size: 0.9rem; }
  .btn--block { width: 100%; }
  .btn--lg { font-size: 1.1rem; }

  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    padding: 10px 18px;
    font-size: 0.9rem;
  }

  /* ---------- Layout & routing ---------- */
  main {
    flex: 1;
    padding: 3rem 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
  }

  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Home ---------- */
  .hero { padding: 6rem 0; text-align: center; }
  .hero h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 700;
    color: var(--teal);
    margin-bottom: 2rem;
  }

  .zoom-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
    opacity: 0;
    background: var(--dark-bg);
  }
  .zoom-overlay.active {
    pointer-events: all;
    animation: zoomFade 1s ease-in-out forwards;
  }
  @keyframes zoomFade {
    0% { opacity: 0; }
    40%, 100% { opacity: 1; }
  }

  /* ---------- Comics grid ---------- */
  .comics-page { padding: 4rem 0; text-align: center; }
  .comics-header { margin-bottom: 3rem; }
  .comics-header h2 { font-size: 2.5rem; color: var(--teal); margin-bottom: 0.5rem; }
  .comics-header p { color: var(--text-muted); font-size: 1.1rem; }

  .comic-grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2rem;
  }

  .comic-card {
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: var(--radius-card);
    padding: 1.5rem;
    width: 320px;
    max-width: 100%;
    cursor: pointer;
    text-align: center;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .comic-card:hover, .comic-card:focus-visible {
    transform: translateY(-5px);
    border-color: var(--teal-dark);
  }
  .comic-cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 1rem;
    background: var(--dark-bg);
  }
  .comic-title { color: var(--teal); font-size: 1.3rem; margin-bottom: 0.25rem; }
  .comic-issue { color: var(--text-muted); font-size: 0.9rem; }
  .read-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 1rem;
    color: var(--teal);
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .comic-card:hover .read-indicator,
  .comic-card:focus-visible .read-indicator { opacity: 1; }

  /* ---------- Reader ---------- */
  .reader-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.98);
    z-index: 2000;
    flex-direction: column;
  }
  .reader-modal.active { display: flex; }

  .reader-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1rem 2rem;
    background: var(--dark-card);
    border-bottom: 1px solid var(--dark-border);
  }
  .reader-title { color: var(--teal); font-size: 1.2rem; }
  .reader-controls { display: flex; align-items: center; gap: 1rem; }
  .page-indicator {
    color: var(--text-light);
    font-size: 0.9rem;
    min-width: 110px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .close-reader {
    background: transparent;
    border: none;
    color: var(--teal);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 8px;
    line-height: 1;
  }
  .close-reader:hover { color: var(--teal-dark); }

  .reader-content {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem;
    touch-action: pan-y;
  }
  .comic-stage {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    min-height: 200px;
  }
  #comic-image {
    max-width: 100%;
    max-height: calc(100vh - 150px);
    width: auto;
    height: auto;
    object-fit: contain;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  #comic-image[hidden] { display: none; }
  .comic-stage.is-busy #comic-image { opacity: 0; }

  .reader-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    color: var(--text-muted);
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .reader-status[hidden] { display: none; }
  .spinner {
    width: 50px;
    height: 50px;
    border: 3px solid var(--dark-border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Whitelist ---------- */
  .content-section { text-align: center; padding: 4rem 0; }
  .content-section h2 { color: var(--teal); font-size: 2.5rem; margin-bottom: 1rem; }
  .content-section > p {
    font-size: 1.15rem;
    max-width: 60ch;
    margin: 0 auto 0.5rem;
  }

  .whitelist-form {
    background: var(--dark-card);
    padding: 2.5rem;
    border-radius: var(--radius-card);
    border: 1px solid var(--dark-border);
    max-width: 600px;
    margin: 2rem auto 0;
    text-align: left;
  }
  .form-group { margin-bottom: 1.5rem; }
  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: var(--teal);
  }
  .form-group input {
    width: 100%;
    padding: 12px 15px;
    background: rgba(10, 10, 15, 0.5);
    border: 1px solid var(--dark-border);
    border-radius: 8px;
    transition: border-color 0.3s ease;
  }
  .form-group input:focus { outline: none; border-color: var(--teal); }

  .progress-info { text-align: center; margin-top: 1.5rem; color: var(--text-muted); }
  .status-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-left: 8px;
    background-color: var(--danger);
    vertical-align: middle;
  }
  .status-indicator.is-online { background-color: var(--teal); }

  .message { margin-top: 1rem; padding: 1rem; border-radius: 8px; text-align: center; }
  .message[hidden] { display: none; }
  .message.is-success {
    background: rgba(0, 255, 208, 0.1);
    color: var(--teal);
    border: 1px solid var(--teal-dark);
  }
  .message.is-error {
    background: rgba(247, 37, 133, 0.1);
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  /* ---------- Footer ---------- */
  footer { padding: 2rem 0; display: flex; justify-content: center; }
  .social-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
  .social-links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: rgba(0, 255, 208, 0.1);
    border: 1px solid var(--teal-dark);
    border-radius: 50%;
    color: var(--teal);
    text-decoration: none;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .social-links a:hover {
    background: rgba(0, 255, 208, 0.2);
    transform: translateY(-3px);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 768px) {
    main { padding: 2rem 0; }
    .hero { padding: 3rem 0; }
    .reader-header { padding: 0.75rem 1rem; flex-wrap: wrap; position: relative; }
    .reader-title { font-size: 1rem; width: 100%; text-align: center; }
    .reader-controls { width: 100%; justify-content: center; gap: 0.5rem; }
    .page-indicator { font-size: 0.8rem; min-width: 90px; }
    .reader-content { padding: 0.5rem; }
    #comic-image { max-height: calc(100dvh - 170px); }
    .close-reader { position: absolute; top: 0.5rem; right: 0.5rem; }
    .whitelist-form { padding: 1.5rem; }
    footer { padding: 1rem 0; }
    .social-links a { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

<div class="image-background" aria-hidden="true">
  <img src="aibonewbkg.png" alt="">
</div>

<div class="zoom-overlay" id="zoomOverlay" aria-hidden="true"></div>

<!-- ============ Comic Reader ============ -->
<div class="reader-modal" id="readerModal" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
  <div class="reader-header">
    <span class="reader-title" id="readerTitle">AIbo</span>
    <div class="reader-controls">
      <button class="btn btn--sm" id="prevPage"><i class="fas fa-chevron-left" aria-hidden="true"></i> Prev</button>
      <span class="page-indicator" id="pageIndicator" role="status" aria-live="polite">Cover (1/1)</span>
      <button class="btn btn--sm" id="nextPage">Next <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
    </div>
    <button class="close-reader" id="closeReader" aria-label="Close reader">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </div>
  <div class="reader-content" id="readerContent">
    <div class="comic-stage" id="comicStage">
      <div class="reader-status" id="readerStatus" hidden>
        <div class="spinner"></div>
        <span>Loading page…</span>
      </div>
      <img id="comic-image" alt="" hidden>
    </div>
  </div>
</div>

<!-- ============ Pages ============ -->
<main>
  <div class="container">

    <section id="home" class="page active">
      <div class="hero">
        <h1>AIbo</h1>
        <button class="btn btn--lg" id="exploreBtn">
          Explore <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </section>

    <section id="comics" class="page">
      <button class="btn back-btn" data-nav="home"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back</button>
      <div class="comics-page">
        <div class="comics-header">
          <h2>Comics</h2>
          <p>Journey through the AIbo universe</p>
        </div>
        <div class="comic-grid" id="comicGrid"></div>
      </div>

    <section id="whitelist" class="page">
      <button class="btn back-btn" data-nav="home"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back</button>
      <div class="content-section">
        <h2>Whitelist</h2>
        <p>Check whether your wallet address is on the whitelist.</p>
        <p>Follow on X and Discord for more chances to secure a seat on the ship.</p>

        <div class="whitelist-form">
          <form id="whitelistForm" novalidate>
            <div class="form-group">
              <label for="walletAddress">Wallet address</label>
              <input type="text" id="walletAddress" name="walletAddress"
                     placeholder="0x…" autocomplete="off" spellcheck="false" required>
            </div>
            <button type="submit" class="btn btn--block btn--lg" id="submitBtn">Check whitelist</button>
            <div class="progress-info">
              <p id="submissionCount">Loading count…<span class="status-indicator" id="statusIndicator"></span></p>
              <p id="serverStatus" style="font-size: 0.8rem; margin-top: 0.5rem;"></p>
            </div>
            <div id="formMessage" class="message" role="status" aria-live="polite" hidden></div>
          </form>

  </div>
</main>

<footer>
  <div class="container">
    <nav class="social-links" aria-label="AIbo links">
      <a href="https://aibouniverse.com" title="Home" aria-label="Home"><i class="fas fa-house" aria-hidden="true"></i></a>
      <a href="https://x.com/aibowtf" target="_blank" rel="noopener" title="X" aria-label="X"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
      <a href="https://discord.gg/N27ugwBgR8" target="_blank" rel="noopener" title="Discord" aria-label="Discord"><i class="fab fa-discord" aria-hidden="true"></i></a>
      <a href="https://github.com/aibowtf" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>
      <a href="https://opensea.io/collection/aibouniverse" target="_blank" rel="noopener" title="OpenSea" aria-label="OpenSea"><i class="fas fa-sailboat" aria-hidden="true"></i></a>
      <a href="https://img_aibowtf.arweave.net" target="_blank" rel="noopener" title="Arweave archive" aria-label="Arweave archive"><i class="fas fa-hard-drive" aria-hidden="true"></i></a>
    </nav>
  </div>
</footer>

<script>
(() => {
  'use strict';

  /* =========================================================
     CONFIG — everything you'll routinely edit lives here.
     ========================================================= */
  const CONFIG = {
    supabaseUrl: 'https://cpmapqoeyahbsuyxsyfh.supabase.co',
    supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwbWFwcW9leWFoYnN1eXhzeWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1ODA1OTYsImV4cCI6MjA3MjE1NjU5Nn0.kz2NnxAtshJL2giZu0A8DPwzQuXpX1MKGbFbAUv0yB0',
    maxWhitelist: 500,
    countRefreshMs: 30_000,
  };

  // Add issues here. `pages` = interior pages, excluding cover and back cover.
  // Files live at comics/issue-<id>/cover.png, page-1.png … page-N.png, back.png
  const COMICS = [
    { id: 1, title: 'AIbo', subtitle: 'Issue #0', pages: 5, back: true },
    // { id: 2, title: 'AIbo', subtitle: 'Issue #1', pages: 8, back: true },
  ];

  const ROUTES = ['home', 'comics', 'whitelist'];
  const REST = `${CONFIG.supabaseUrl}/rest/v1`;

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  const placeholder = (label, w = 300, h = 450) =>
    'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">` +
      `<rect width="${w}" height="${h}" fill="#15151f"/>` +
      `<text x="50%" y="50%" fill="#00ffd0" font-family="monospace" font-size="18" ` +
      `text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`
    );

  function flash(el, text, kind = 'error', ms = 6000) {
    if (!el) return;
    el.textContent = text;
    el.className = `message is-${kind}`;
    el.hidden = false;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.hidden = true; }, ms);
  }

  /* =========================================================
     COMIC READER
     Single source of truth + a load token so fast page-flips
     can never let a stale image win the race.
     ========================================================= */
  const imageCache = new Map();

  function preload(src) {
    let entry = imageCache.get(src);
    if (entry) return entry;
    entry = new Promise((resolve, reject) => {
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`Failed to load ${src}`));
      img.src = src;
    });
    // Don't cache rejections — a retry should get a fresh attempt.
    entry.catch(() => imageCache.delete(src));
    imageCache.set(src, entry);
    return entry;
  }

  const Reader = {
    el: {
      modal: $('#readerModal'),
      stage: $('#comicStage'),
      img: $('#comic-image'),
      status: $('#readerStatus'),
      title: $('#readerTitle'),
      indicator: $('#pageIndicator'),
      prev: $('#prevPage'),
      next: $('#nextPage'),
      close: $('#closeReader'),
      content: $('#readerContent'),
    },
    pages: [],
    index: 0,
    token: 0,
    lastFocus: null,

    open(pages, title) {
      this.pages = pages;
      this.index = 0;
      this.lastFocus = document.activeElement;
      this.el.title.textContent = title;
      this.el.modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      this.el.close.focus();
      this.show(0);
      // Warm the rest of the issue once the browser is idle, so it never
      // competes with the page the reader is actually waiting on.
      const idle = window.requestIdleCallback
        ? window.requestIdleCallback.bind(window)
        : (cb => setTimeout(cb, 400));
      idle(() => pages.forEach(p => preload(p.src)));
    },

    close() {
      this.token++;                       // invalidate any in-flight load
      this.el.modal.classList.remove('active');
      document.body.style.overflow = '';
      this.pages = [];
      this.el.img.hidden = true;
      this.el.img.removeAttribute('src');
      this.lastFocus?.focus?.();
    },

    isOpen() { return this.el.modal.classList.contains('active'); },

    async show(i) {
      if (i < 0 || i >= this.pages.length) return;
      const token = ++this.token;
      this.index = i;
      this.syncChrome();

      const { src, label } = this.pages[i];
      const cached = imageCache.has(src);
      if (!cached) this.setBusy(true, 'Loading page…');

      try {
        const img = await preload(src);
        if (token !== this.token) return;   // user moved on; drop this result
        this.el.img.src = img.src;
        this.el.img.alt = `${this.el.title.textContent} — ${label}`;
        this.el.img.hidden = false;
        this.setBusy(false);
      } catch {
        if (token !== this.token) return;
        this.el.img.hidden = true;
        this.setBusy(true,
          'This page didn\u2019t load. Check your connection and try again.', true);
      }

      // Neighbours only — the full-issue warm-up is already queued on idle.
      [i - 1, i + 1, i + 2].forEach(n => {
        if (n >= 0 && n < this.pages.length) preload(this.pages[n].src);
      });
    },

    setBusy(busy, text = '', isError = false) {
      this.el.stage.classList.toggle('is-busy', busy);
      this.el.status.hidden = !busy;
      if (busy) {
        this.el.status.innerHTML = isError
          ? `<i class="fas fa-triangle-exclamation" style="font-size:2rem;color:var(--danger)"></i><span></span>`
          : `<div class="spinner"></div><span></span>`;
        $('span', this.el.status).textContent = text;
      }
    },

    syncChrome() {
      const { label } = this.pages[this.index];
      this.el.indicator.textContent = `${label} (${this.index + 1}/${this.pages.length})`;
      this.el.prev.disabled = this.index === 0;
      this.el.next.disabled = this.index === this.pages.length - 1;
    },

    prev() { this.show(this.index - 1); },
    next() { this.show(this.index + 1); },
  };

  function pagesFor(comic) {
    const dir = `comics/issue-${comic.id}`;
    const list = [{ src: `${dir}/cover.png`, label: 'Cover' }];
    for (let i = 1; i <= comic.pages; i++) {
      list.push({ src: `${dir}/page-${i}.png`, label: `Page ${i}` });
    }
    if (comic.back !== false) list.push({ src: `${dir}/back.png`, label: 'Back cover' });
    return list;
  }

  function renderComicCards() {
    const grid = $('#comicGrid');
    grid.replaceChildren();

    COMICS.forEach(comic => {
      const full = `${comic.title} ${comic.subtitle}`;
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'comic-card';
      card.innerHTML = `
        <img class="comic-cover" alt="${full} cover"
             src="comics/issue-${comic.id}/cover.png" loading="lazy">
        <h3 class="comic-title"></h3>
        <span class="comic-issue"></span>
        <div class="read-indicator"><i class="fas fa-book-open" aria-hidden="true"></i> Click to read</div>`;
      $('.comic-title', card).textContent = comic.title;
      $('.comic-issue', card).textContent = comic.subtitle;
      $('.comic-cover', card).addEventListener('error', e => {
        e.target.src = placeholder(comic.subtitle);
      }, { once: true });
      card.addEventListener('click', () => Reader.open(pagesFor(comic), full));
      grid.append(card);
    });
  }

  Reader.el.prev.addEventListener('click', () => Reader.prev());
  Reader.el.next.addEventListener('click', () => Reader.next());
  Reader.el.close.addEventListener('click', () => Reader.close());

  document.addEventListener('keydown', e => {
    if (!Reader.isOpen()) return;
    if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); Reader.prev(); }
    else if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); Reader.next(); }
    else if (e.key === 'Escape') Reader.close();
    else if (e.key === 'Home') { e.preventDefault(); Reader.show(0); }
    else if (e.key === 'End') { e.preventDefault(); Reader.show(Reader.pages.length - 1); }
  });

  // Swipe navigation
  {
    let startX = null, startY = null;
    const c = Reader.el.content;
    c.addEventListener('touchstart', e => {
      startX = e.changedTouches[0].clientX;
      startY = e.changedTouches[0].clientY;
    }, { passive: true });
    c.addEventListener('touchend', e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        dx < 0 ? Reader.next() : Reader.prev();
      }
      startX = startY = null;
    }, { passive: true });
  }

  /* =========================================================
     ROUTER
     ========================================================= */
  function currentRoute() {
    const id = location.hash.replace('#', '').split(/[?&/]/)[0];
    return ROUTES.includes(id) ? id : 'home';
  }

  let activeRoute = null;

  function navigate(id, { push = true } = {}) {
    const route = ROUTES.includes(id) ? id : 'home';

    // Let the hash be the single source of truth: change it and let the
    // hashchange handler finish the transition. Avoids running the page's
    // setup twice on every click.
    if (push && currentRoute() !== route) { location.hash = route; return; }
    if (route === activeRoute) return;
    activeRoute = route;

    $$('.page').forEach(p => p.classList.toggle('active', p.id === route));
    window.scrollTo(0, 0);

    Whitelist.setActive(route === 'whitelist');
  }

  $$('[data-nav]').forEach(btn =>
    btn.addEventListener('click', () => navigate(btn.dataset.nav)));

  $('#exploreBtn').addEventListener('click', () => {
    const overlay = $('#zoomOverlay');
    overlay.classList.add('active');
    setTimeout(() => {
      overlay.classList.remove('active');
      navigate('comics');
    }, 800);
  });

  window.addEventListener('hashchange', () => navigate(currentRoute(), { push: false }));

  /* =========================================================
     WHITELIST — talks to PostgREST directly.
     Dropping supabase-js saves ~120 KB of JS; the trade-off is
     the live counter polls instead of using realtime sockets.
     ========================================================= */
  const sbHeaders = {
    apikey: CONFIG.supabaseAnonKey,
    Authorization: `Bearer ${CONFIG.supabaseAnonKey}`,
  };

  const Whitelist = {
    timer: null,
    els: {
      count: $('#submissionCount'),
      status: $('#serverStatus'),
      dot: $('#statusIndicator'),
      msg: $('#formMessage'),
      form: $('#whitelistForm'),
      input: $('#walletAddress'),
      submit: $('#submitBtn'),
    },

    setActive(on) {
      clearInterval(this.timer);
      this.timer = null;
      if (!on) return;
      this.refresh();
      this.timer = setInterval(() => {
        if (!document.hidden) this.refresh();
      }, CONFIG.countRefreshMs);
    },

    async refresh() {
      const { count, status, dot } = this.els;
      try {
        const res = await fetch(`${REST}/whitelist?select=wallet_address`, {
          headers: { ...sbHeaders, Prefer: 'count=exact', Range: '0-0' },
        });
        if (!res.ok) throw new Error(res.status);
        const range = res.headers.get('content-range');
        const total = range ? Number(range.split('/')[1]) : NaN;
        if (!Number.isFinite(total)) throw new Error('content-range not exposed');
        count.textContent = `${total}/${CONFIG.maxWhitelist} addresses on whitelist`;
        count.append(dot);
        dot.classList.add('is-online');
        status.textContent = 'Live count from server';
      } catch {
        count.textContent = 'Count unavailable';
        count.append(dot);
        dot.classList.remove('is-online');
        status.textContent = 'Can\u2019t reach the server right now.';
      }
    },

    async check(address) {
      const res = await fetch(
        `${REST}/whitelist?select=wallet_address&wallet_address=eq.${encodeURIComponent(address)}`,
        { headers: sbHeaders });
      if (!res.ok) throw new Error(`Lookup failed (${res.status})`);
      const rows = await res.json();
      return rows.length > 0;
    },
  };

  Whitelist.els.form.addEventListener('submit', async e => {
    e.preventDefault();
    const { input, submit, msg } = Whitelist.els;
    const address = input.value.trim().toLowerCase();

    if (!/^0x[a-f0-9]{40}$/.test(address)) {
      flash(msg, 'Enter a valid wallet address: 0x followed by 40 hex characters.');
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Checking…';
    try {
      const listed = await Whitelist.check(address);
      listed
        ? flash(msg, '\u2713 This wallet is on the whitelist.', 'success')
        : flash(msg, '\u2717 This wallet is not on the whitelist.');
      input.value = '';
    } catch (err) {
      flash(msg, `Couldn\u2019t check the whitelist. ${err.message}`);
    } finally {
      submit.disabled = false;
      submit.textContent = 'Check whitelist';
    }
  });

  /* =========================================================
     BOOT
     ========================================================= */
  renderComicCards();
  navigate(currentRoute(), { push: false });
})();
</script>
</body>
</html>
